name: Build and Release EduBedrockProxy

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build with Gradle
        run: |
          if [ -f "build.gradle.kts" ]; then
            gradle shadowJar
          elif [ -f "waterdog-edubridge-plugin/build.gradle.kts" ]; then
            cd waterdog-edubridge-plugin
            gradle shadowJar
          else
            echo "Gradle build file not found!"
            exit 1
          fi

      - name: Find Built Jar
        id: find_jar
        run: |
          JAR_PATH=$(find . -name "EduBedrockProxy-*.jar" | head -n 1)
          echo "jar_path=$JAR_PATH" >> $GITHUB_OUTPUT
          echo "Found jar at: $JAR_PATH"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.0-${{ github.run_number }}
          name: "EduBedrockProxy v2.0.0 (Custom Build)"
          files: ${{ steps.find_jar.outputs.jar_path }}
          body: "Automated build featuring full RakNet Ping/Pong state machine and M365 Education validation."