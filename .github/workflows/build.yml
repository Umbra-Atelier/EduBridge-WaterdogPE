name: Build EduBridge Plugin

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build with Gradle
        run: |
          # Checks if build.gradle.kts is in root or in a subfolder
          if [ -f "build.gradle.kts" ]; then
            gradle build
          elif [ -f "waterdog-edubridge-plugin/build.gradle.kts" ]; then
            cd waterdog-edubridge-plugin
            gradle build
          else
            echo "Gradle build file not found!"
            exit 1
          fi

      - name: Upload Compiled Jar Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WaterdogPE-EduBridge-Jar
          path: |
            build/libs/*.jar
            **/build/libs/*.jar
