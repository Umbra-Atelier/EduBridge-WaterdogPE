# ============================================================================
# EduBedrockProxy Configuration (Raspberry Pi 4 Native Stack)
# Bridges Minecraft: Education Edition (M365 Entra ID + NetherNet) -> PowerNukkitX (:19133)
# ============================================================================

# 1. Front-facing Bedrock / RakNet & NetherNet Proxy Listener (Port 19132)
proxy-listener:
  host: "0.0.0.0"
  port: 19132
  # Set to AUTO to detect Raspberry Pi LAN IP, or set your public/school IP
  external-address: "AUTO"
  motd: "§bOakridge School §7- §aMinecraft Education Edition"
  sub_motd: "§fM365 Authenticated Classroom Server"

# 2. Downstream PowerNukkitX Native Bedrock Server (Port 19133)
downstream-pnx:
  host: "127.0.0.1"
  port: 19133
  target-server-name: "lobby"
  # Injects signed extraData Bedrock JWT containing verified M365 attributes
  inject-signed-extradata: true

# 3. Microsoft 365 / Entra ID Tenant Settings
m365-auth:
  verify-jwt-signature: true
  jwks-uri-template: "https://login.microsoftonline.com/{tenant}/discovery/v2.0/keys"
  allowed-tenant-ids:
    - "84c31ca0-ac3b-4eae-ad11-519d80233e6f"
    - "f8cdef31-a31e-4b4a-93e4-5f571e91255a"
  allowed-domains:
    - "students.oakridge.edu"
    - "faculty.oakridge.edu"
  teacher-domains:
    - "faculty.oakridge.edu"
  allow-hybrid-retail-xbox: true
  xuid-hash-salt: "edubridge-rpi4-pnx-salt-2026"

# 4. Microsoft Education Session Broker, 4-Picture Join Code & NetherNet Connection ID
#    Replaces EduGeyser's Geyser-Education-Extension without needing a Java Server!
classroom-join-code:
  enabled: true
  # 4-Picture Join Code using official M:EE symbols:
  # BOOK, QUILL, BALLOON, RAIL, ALEX, STEVE, APPLE, COOKIE, FISH,
  # CAKE, PICKAXE, SWORD, POTION, BUCKET, MAP, COMPASS, PANDA, AGENT
  active-code: "BOOK-APPLE-PANDA-RAIL"
  # Persistent 18-digit NetherNet Connection ID (saved in nethernet/connection-id.yml)
  nethernet-connection-id: "AUTO"
  world-name: "Oakridge School Classroom"
  host-name: "RaspberryPi4-EduProxy"
  session-ttl-minutes: 180

# 5. Raspberry Pi 4 (ARM64 Cortex-A72) Performance Tuning
hardware-tuning:
  async-verifier-threads: 2
  max-token-cache-entries: 256
  jwks-cache-hours: 24
